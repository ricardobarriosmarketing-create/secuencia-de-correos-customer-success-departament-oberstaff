{g:"Bienvenida al talento",n:"B1 · Lo lograste",w:"Inmediato, al pasar a “Activo” en Bigin",s:"Oberstaffer, lo lograste: bienvenido/a a Oberstaff",p:"Detrás de tu selección hay mucho trabajo tuyo. Esto es lo que sigue.",b:`Oberstaffer {{nombre}}, ¡lo lograste!
Antes de cualquier trámite queremos decirte algo: felicidades. Entre todas las personas que aplicaron, la elegida para el cargo de {{rol}} fuiste tú.

{g:"Bienvenida al talento",n:"B2 · Ontop, tu nueva forma de cobrar",w:"Día 1 (24 h después de B1) · Nuevo",s:"Oberstaffer, tenemos una sorpresa para ti: conoce Ontop",p:"Una sorpresa pensada para cuidar lo que ganas.",b:`Oberstaffer {{nombre}}, tenemos una sorpresa para ti.

{g:"Bienvenida al talento",n:"B3 · Por qué existe tu lugar",w:"Día 2 · Nuevo",s:"Oberstaffer, por qué existe tu lugar en Oberstaff",p:"El contexto detrás de cada oportunidad que conectamos.",b:`Oberstaffer {{nombre}}, queremos contarte algo que no siempre se dice.

Del otro lado, en varios países de Latinoamérica sabemos lo difícil que es cuidar el ingreso cuando la inflación se come el valor de la moneda local. Ahí vimos la oportunidad: conectar a esas empresas con profesionales como tú, que reciben ingresos competitivos en divisa extranjera y protegen su dinero.

{g:"Newsletter para el talento",n:"Edición 1 · Qué es Oberstaff",w:"Mes 1 · segundo martes de cada mes",s:"Oberstaffer, conoce a los clientes que confían en tu talento",p:"Entender a quién servimos te ayuda a destacar.",b:`> Estructura fija: portada, bienvenidas, cumpleaños, aniversarios, profesional del mes, tip del mes, recordatorio, referidos y botón de reseña. Bloque especial del mes 1: mapa de clientes ideales.

Gracias por tu compromiso. Nos importa cómo te sientes, no solo cómo rindes.
~Un abrazo, {{manager_cs}} · Customer Success, Oberstaff`},
{g:"Encuestas y facturación",n:"F1 · Recordatorio de pago de factura",w:"5 días después del envío de la factura, si no hay confirmación",s:"{{nombre_cliente}}, recordatorio amable sobre la factura de {{profesional}}",p:"Un pago a tiempo cuida la gestión de tu profesional.",a:"Confirmar recepción de la factura y registrar fecha compromiso de pago en Bigin.",b:`Hola, {{nombre_cliente}}:
El pasado te enviamos un correo con la factura correspondiente al pago por honorarios profesionales de tu cliente/a **{{factura_ref}}**.
Te escribimos con un recordatorio amable: realizar el pago a tiempo contribuye directamente a la correcta gestión de {{profesional}} y a la continuidad del servicio que hoy tienes con nosotros.
Si ya realizaste el pago, responde este correo con el comprobante y lo registramos hoy mismo. Si necesitas una copia de la factura o tienes alguna duda sobre el proceso, también estamos aquí.
[[Confirmar pago / solicitar factura]]
Gracias por tu confianza.
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Encuestas y facturación",n:"F3 · Factura próxima a vencer",w:"3 días antes del vencimiento · Nuevo",s:"{{nombre_cliente}}, tu factura vence en 3 días",p:"Un recordatorio preventivo, sin trámites de último minuto.",b:`Hola, {{nombre_cliente}}:
Te escribimos con un recordatorio preventivo: la factura **{{factura_ref}}** vence en 3 días. Avisar con tiempo evita trámites de último minuto y mantiene la operación de {{profesional}} sin interrupciones.
[[Ver factura y pagar]]
Si ya está programada o pagada, ignora este mensaje y mil gracias.
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Encuestas y facturación",n:"F2 · Confirmación de pago recibido",w:"Al registrar el pago en Bigin · automático · Nuevo",s:"{{nombre_cliente}}, recibimos tu pago: gracias",p:"",b:`Hola, {{nombre_cliente}}:
Confirmamos la recepción del pago correspondiente a la factura **{{factura_ref}}**. Gracias por tu puntualidad: eso nos permite sostener la continuidad y la calidad del servicio de {{profesional}}.
Si necesitas el recibo o algún documento adicional, responde este correo y te lo enviamos.
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Clientes (días 0 a 90)",n:"C0 · Bienvenida e integración",w:"Día 0 · Antes del onboarding, al iniciar la asignación",s:"Bienvenida e integración de {{profesional}} a tu operación",p:"Tu sesión de onboarding y tres cosas para preparar antes.",a:"Confirmar asistencia y tres primeras prioridades antes del onboarding.",b:`Hola, {{nombre_cliente}}:
Gracias por confiar en nosotros. Nos alegra darte la bienvenida a esta nueva etapa junto a {{profesional}}, y queremos que el inicio sea ordenado y tranquilo.
**Tu sesión de onboarding:** {{fecha_onboarding}} a las {{hora}} ({{huso}}).
[[Unirme a la sesión]]
En la reunión validaremos juntos tres puntos:
- Los objetivos principales del rol.
- Las herramientas y accesos necesarios.
- La forma de comunicar prioridades y avances.
Para aprovecharla mejor, te invitamos a identificar antes de la sesión las tres primeras tareas que quieres delegar y cómo reconocerás que quedaron bien hechas.
[[Confirmar asistencia y mis 3 prioridades]]
Tu contacto en Customer Success será {{analista}}. Estamos a tu disposición para acompañarte en cada paso.
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Clientes (días 0 a 90)",n:"C7 · Organizar la primera semana",w:"Día 7 · Recurso de valor",s:"Una forma sencilla de organizar la primera semana",p:"Tres prioridades, un resultado claro y una fecha de revisión.",a:"Que el cliente envíe una lista de tres prioridades y la primera fecha de revisión.",b:`Hola, {{nombre_cliente}}:
Para ayudar a {{profesional}} a enfocarse en lo importante, te proponemos una dinámica que toma solo unos minutos: elegir tres prioridades, describir el resultado esperado de cada una y fijar una fecha clara de revisión.
# Un ejemplo
> En vez de “organizar los datos”, indica “consolidar el reporte de ventas de lunes a viernes con las columnas X, Y y Z, y enviarlo el viernes”.
Un mensaje al inicio de la semana y una revisión breve al cierre suelen evitar dudas y retrabajo.
Si te sirve, con gusto te ayudamos a adaptar este formato a tu operación.
[[Enviar mis 3 prioridades]]
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Clientes (días 0 a 90)",n:"C21 · Feedback que mejora resultados",w:"Día 21 · Aprendizaje",s:"Cómo dar retroalimentación que realmente mejore resultados",p:"Un formato de tres elementos para dar claridad sin microgestionar.",a:"Que el cliente identifique una mejora concreta y la comunique con el formato de tres elementos.",b:`Hola, {{nombre_cliente}}:
Cuando detectas algo que puede mejorar, el feedback más útil combina tres elementos:
- **Qué sucedió.**
- **Qué efecto tuvo.**
- **Qué esperas la próxima vez.**
# Un ejemplo
> “En el último reporte faltaron dos registros, por eso tuvimos que revisarlo otra vez. Para el siguiente, usa esta lista de verificación antes de enviarlo”.
El objetivo no es supervisar más, sino dar claridad para que {{profesional}} gane autonomía y confianza.
Si quieres, te compartimos una plantilla breve para registrar acuerdos.
[[Quiero la plantilla]]
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Clientes (días 0 a 90)",n:"C37 · Tablero semanal",w:"Día 37 · Recurso mes 2",s:"Tu tablero semanal en cuatro columnas",p:"Visibilidad sin interrumpir a tu profesional.",a:"Revisar si existen tareas sin responsable, fecha o criterio de finalización.",b:`Hola, {{nombre_cliente}}:
A medida que la relación de trabajo se consolida, un tablero sencillo te da visibilidad sin tener que interrumpir a {{profesional}} continuamente. Puedes organizarlo en cuatro columnas:
- Pendiente
- En curso
- Bloqueado
- Terminado
Agrega a cada tarea una fecha de entrega y una definición breve de “terminado”. Una revisión de diez minutos a mitad de semana permite destrabar lo importante sin microgestión.
Si ya usas una herramienta de trabajo, esta misma lógica se puede aplicar allí, sin duplicar registros.
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Clientes (días 0 a 90)",n:"C52 · Detectar un problema a tiempo",w:"Día 52 · Recurso mes 2",s:"Detectar un problema temprano facilita resolverlo",p:"Cuatro datos que nos ayudan a actuar rápido.",a:"Que el cliente comparta cualquier incidencia abierta y acordar una fecha de respuesta.",b:`Hola, {{nombre_cliente}}:
Si aparece una dificultad de comunicación, una entrega se retrasa o cambia una prioridad, conviene avisarnos apenas lo notes. Con estos cuatro datos podemos ayudarte mucho más rápido:
- Qué pasó.
- Cuándo ocurrió.
- Qué impacto tuvo.
- Qué apoyo necesitas.
Con esa información, Customer Success evalúa la situación, coordina la revisión que corresponda y da seguimiento hasta llegar a una solución concreta.
No hace falta esperar a la próxima llamada: estamos disponibles por los canales habituales.
[[Escribir a Customer Success]]
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Clientes (días 0 a 90)",n:"C72 · Impacto del trabajo delegado",w:"Día 72 · Recurso mes 3",s:"¿Qué impacto está teniendo el trabajo delegado?",p:"Tres indicadores sencillos para mirar más allá del número de tareas.",a:"Que el cliente elija una evidencia del valor aportado y la comparta en la llamada.",b:`Hola, {{nombre_cliente}}:
A estas alturas vale la pena mirar más allá de cuántas tareas se completaron. Te proponemos revisar tres indicadores sencillos:
- Actividades que ya no requieren tu intervención.
- Entregas que hoy salen con mayor consistencia.
- Tiempo de coordinación que se ha reducido.
No hace falta medirlo todo. Elige una sola mejora observable y compárala con el punto de partida del primer mes.
En nuestra próxima conversación revisamos ese resultado juntos y definimos un objetivo práctico para el siguiente trimestre.
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Clientes (días 0 a 90)",n:"C90 · Cierre del trimestre",w:"Día 90 · Evaluación",s:"Cerramos el trimestre: resultados y próximos objetivos",p:"Tu experiencia nos ayuda a construir la siguiente etapa.",a:"Registrar CSAT/NPS según la encuesta vigente y compartir el compromiso de mejora.",b:`Hola, {{nombre_cliente}}:
¡Ya completamos los primeros 90 días de acompañamiento! Gracias por tu confianza. Queremos construir la siguiente etapa a partir de tu experiencia.
Te invitamos a responder una evaluación breve y a contarnos tres cosas:
- Un resultado que deseas mantener.
- Un aspecto por mejorar.
- Una meta para el próximo trimestre.
[[Responder la evaluación]]
Con tus comentarios orientaremos el seguimiento y, cuando corresponda, te compartiremos recursos específicos para que el servicio siga aportándote valor.
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Profesionales (días 0 a 90)",n:"P0 · Tu inicio con el cliente",w:"Día 0 · Inicio de la asignación",s:"Tu inicio con {{cliente_nombre}}: información y primeros pasos",p:"Todo lo que necesitas para arrancar con claridad.",a:"Confirmar que recibió la información y registrar accesos pendientes.",b:`Oberstaffer {{nombre}}, ¡empezamos una nueva asignación!
Te damos la bienvenida a esta etapa con {{cliente_nombre}}. Antes de comenzar, verifica que tienes a mano:
- Tu rol y fecha de inicio.
- El horario y los canales acordados.
- Tus accesos y la persona de contacto.
Para tu primera semana te recomendamos confirmar por escrito las prioridades y el formato esperado de cada entrega. Si falta un acceso o una instrucción, avísanos cuanto antes: preferimos ayudarte a tiempo.
En el onboarding revisaremos juntos las herramientas, la dinámica de comunicación y los recursos de apoyo y formación.
[[Confirmar que recibí la información]]
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Profesionales (días 0 a 90)",n:"P7 · Tres hábitos para trabajar en remoto",w:"Día 7 · Recurso",s:"Tres hábitos para trabajar con claridad en remoto",p:"Una rutina simple que te da visibilidad y tranquilidad.",a:"Que ponga en práctica un resumen corto al cierre durante la semana.",b:`Oberstaffer {{nombre}}, queremos compartirte una rutina simple para ganar consistencia:
- **Al iniciar,** confirma tus prioridades.
- **Durante el día,** registra avances y bloqueos.
- **Al terminar,** resume lo completado y lo que sigue.
# Un ejemplo de cierre
> “Hoy terminé A y B. C quedó pendiente por falta de un dato. Mañana continúo con D y necesito validar un punto.”
Esta práctica mantiene la visibilidad y evita que los problemas se conozcan demasiado tarde.
Esta semana, ¿te animas a probar el resumen de cierre? Si algo no te funciona, cuéntanos y lo ajustamos contigo.
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Profesionales (días 0 a 90)",n:"P21 · Confirmar instrucciones",w:"Día 21 · Aprendizaje",s:"Cómo confirmar instrucciones y evitar retrabajo",p:"Una pregunta a tiempo ahorra horas de correcciones.",a:"Que elija una tarea y confirme sus criterios de entrega antes de ejecutarla.",b:`Oberstaffer {{nombre}}, cuando una solicitud es nueva o poco clara, una pregunta a tiempo evita horas de correcciones. Antes de empezar, valida:
- El resultado esperado.
- El formato.
- La fecha.
- Las referencias disponibles.
Puedes usar esta frase:
> “Para confirmar, entregaré [resultado] con [formato] antes del [fecha]. ¿Hay algún ejemplo o criterio adicional que deba considerar?”
Recuerda: comunicar una duda no es una debilidad, es una práctica de calidad. Y tus preguntas son bienvenidas.
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Profesionales (días 0 a 90)",n:"P37 · Checklist de calidad",w:"Día 37 · Recurso mes 2",s:"Checklist de calidad antes de entregar",p:"Dos minutos de revisión que evitan correcciones.",a:"Que cree o actualice un checklist de una tarea frecuente.",b:`Oberstaffer {{nombre}}, una revisión de dos minutos puede ahorrarte muchas correcciones. Antes de enviar una tarea, comprueba cinco puntos:
- El contenido es correcto.
- El formato es el solicitado.
- Los datos están completos.
- Los enlaces o adjuntos funcionan.
- La siguiente acción queda clara.
Si tienes tareas recurrentes, convierte esta lista en una plantilla personal. Así mantendrás la calidad incluso cuando aumente el volumen de trabajo.
Si quieres reforzar alguna habilidad, cuéntanos y te orientamos con un recurso de formación.
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Profesionales (días 0 a 90)",n:"P52 · Prioridades claras",w:"Día 52 · Recurso mes 2",s:"Prioridades claras cuando todo parece urgente",p:"Cómo ordenar varias solicitudes y reportar un bloqueo.",a:"Que aplique una clasificación de prioridades y reporte un bloqueo con contexto.",b:`Oberstaffer {{nombre}}, si recibes varias solicitudes a la vez, no asumas que todas tienen la misma urgencia. Ordénalas por:
- Fecha comprometida.
- Impacto.
- Dependencias.
Después, confirma con la persona responsable en {{cliente_nombre}} qué se atiende primero.
Si aparece un bloqueo, cuéntanos qué necesitas, desde cuándo y qué tarea queda afectada. Esa claridad acelera las decisiones y protege la calidad de tu trabajo.
¿No estás seguro/a de qué canal usar para plantear una dificultad? Customer Success te orienta con gusto.
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Profesionales (días 0 a 90)",n:"P67 · Autonomía responsable",w:"Día 67 · Recurso mes 3",s:"Autonomía responsable: anticípate sin cambiar el proceso",p:"Cómo proponer mejoras pequeñas con criterio.",a:"Que prepare una propuesta sencilla y la valide con el responsable.",b:`Oberstaffer {{nombre}}, con más experiencia en tu rol ya puedes detectar mejoras pequeñas: una plantilla que evite pasos repetidos, una validación que reduzca errores o una forma más clara de informar avances.
Cuando tengas una idea, propónla con este formato:
> Situación actual / mejora sugerida / beneficio esperado.
Antes de modificar un proceso, confirma la aprobación de la persona responsable. La proactividad aporta valor cuando se combina con comunicación y criterio.
Tus ideas nos importan. Si quieres comentar una con nosotros antes de llevarla al cliente, escríbenos.
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Profesionales (días 0 a 90)",n:"P82 · Tu siguiente paso de desarrollo",w:"Día 82 · Recurso mes 3",s:"Tu siguiente paso de desarrollo profesional",p:"Elige una habilidad para fortalecer el próximo trimestre.",a:"Que defina una competencia, una práctica y una fecha para revisar su avance.",b:`Oberstaffer {{nombre}}, en estos meses has acumulado experiencia real con tu cliente, y queremos ayudarte a seguir creciendo.
Te invitamos a elegir una habilidad para fortalecer el próximo trimestre:
- Organización.
- Comunicación.
- Calidad.
- Herramientas digitales.
- Conocimiento del proceso.
Una buena meta es específica y observable. Por ejemplo: “reducir las correcciones del reporte recurrente con un checklist, y validar su eficacia durante cuatro entregas”.
Cuéntanos tu prioridad y te recomendamos una cápsula o recurso de aprendizaje.
[[Elegir mi habilidad]]
~Un abrazo, {{analista}} · Customer Success, Oberstaff`},
{g:"Secuencia CS · Profesionales (días 0 a 90)",n:"P90 · Balance de tus primeros 90 días",w:"Día 90 · Evaluación",s:"Balance de tus primeros 90 días y plan de crecimiento",p:"Queremos escuchar tu experiencia.",a:"Registrar pulso, fortalezas y una acción formativa con fecha.",b:`Oberstaffer {{nombre}}, estás llegando al cierre de tus primeros 90 días en esta asignación y queremos escucharte. Nos interesa saber qué te ha funcionado, qué dificultades siguen y qué apoyo o formación te ayudaría a rendir mejor.
Te compartimos un pulso breve y te invitamos a mencionar un logro concreto y una habilidad que quieras seguir desarrollando.
[[Responder mi pulso (1 min)]]
Gracias por tu compromiso. Nuestro objetivo es acompañarte con herramientas útiles y seguimiento oportuno.
~Un abrazo, {{analista}} · Customer Success, Oberstaff`}
];

const val=k=>SAMPLE[k]!==undefined?SAMPLE[k]:k;
function inline(t){return t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[\[(.+?)\]\]/g,'<a class="btn" href="#" onclick="return false">$1</a>').replace(/\{\{(\w+)\}\}/g,(m,k)=>"<mark>"+val(k)+"</mark>").replace(/\[((?:PASOS ONTOP|MONTO|formulario)[^\]]*)\]/g,'<span class="ph">[$1]</span>')}
function render(body){let h="",ul=false;const close=()=>{if(ul){h+="</ul>";ul=false}};
body.split("\n").forEach(l=>{if(l.startsWith("- ")){if(!ul){h+="<ul>";ul=true}h+="<li>"+inline(l.slice(2))+"</li>";return}close();
if(l.startsWith("# "))h+="<h3>"+inline(l.slice(2))+"</h3>";else if(l.startsWith("> "))h+='<div class="note">'+inline(l.slice(2))+"</div>";else if(l.startsWith("~"))h+='<p class="sig">'+inline(l.slice(1))+"</p>";else if(l.startsWith("[["))h+="<p>"+inline(l)+"</p>";else h+="<p>"+inline(l)+"</p>"});close();return h}

function slot(src,alt,cls){
  if(!src) return '<div class="'+cls+' slot-empty">Espacio para '+((cls==="banner")?"banner":"footer")+' · colocar imagen</div>';
  return '<div class="'+cls+'"><img src="'+src+'" alt="'+(alt||"")+'"></div>';
}
